name: E2E intake smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-intake-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Submit public FIBARO lead
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS \
            -F 'nombre=E2E TEST FIBARO 20260906' \
            -F 'telefono=600000091' \
            -F 'servicio=fiber' \
            -F 'intent=web_funnel' \
            -F 'consent=yes' \
            -F 'website=' \
            -F 'postal_code=11540' \
            -F 'technical_zone=yes' \
            -F 'funnel_detail=fibra_movil' \
            -F 'funnel_objective=pagar_menos' \
            -F 'spend_band=50_70' \
            -F 'contact_preference=whatsapp' \
            -F 'anonymous_id=e2e-fibaro-20260906' \
            -F 'utm_source=chatgpt-e2e' \
            -F 'utm_medium=automated-smoke' \
            -F 'utm_campaign=production-launch' \
            -F 'utm_content=github-actions' \
            -F 'landing_path=/' \
            -F 'funnel_context={"service":"telecom","detail":"fibra_movil","objective":"pagar_menos","spend":"50_70","postal_code":"11540","technical_zone":true}' \
            'https://kgcuqxzpxykqszdeonte.supabase.co/functions/v1/submit-intake')
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == true and (.reference | startswith("FB-")) and (.lead_id | length > 0) and (.intake_id | length > 0)'
