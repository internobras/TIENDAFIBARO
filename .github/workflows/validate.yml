name: Validate FIBARO Web

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/brand-init.js
          node --check assets/logo-data.js
          node --check assets/alicia-data-1.js
      - name: Ensure removed Gas offer is not public
        run: |
          if grep -RniE '\bGas\b|Luz y gas|luz/gas' index.html config.js assets/app.js assets/styles.css assets/brand.css privacidad.html aviso-legal.html; then
            echo 'Gas references found in customer-facing files'
            exit 1
          fi
      - name: Validate connected conversion funnel and real brand assets
        run: |
          grep -q 'intakeEndpoint' config.js
          grep -q 'leadCaptureEnabled: true' config.js
          grep -q 'submitLead' assets/app.js
          grep -q 'data-alicia-photo' index.html
          grep -q 'data-fibaro-logo' index.html
          grep -q 'alicia-data-1.js' index.html
          grep -q 'logo-data.js' index.html
          grep -q 'brand-init.js' index.html
          grep -q 'data-open-funnel' index.html
          grep -q 'rewrites' vercel.json
          grep -q 'Content-Security-Policy' vercel.json
      - name: Guard against broken external brand dependencies
        run: |
          if grep -Rni 'raw.githubusercontent.com' index.html config.js assets/app.js assets/brand-init.js; then
            echo 'External raw GitHub asset dependency found'
            exit 1
          fi
