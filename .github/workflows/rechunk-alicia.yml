name: Rechunk Alicia asset
on:
  push:
    branches: [chatgpt/alicia-small-chunks]
permissions:
  contents: write
jobs:
  rechunk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rechunk without changing payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re, json
          p=Path('assets/alicia-data-1.js')
          s=p.read_text()
          m=re.search(r"window\.__FIBARO_ASSETS\.alicia\[0\]=\[\n(.*?)\n\]\.join\(''\);",s,re.S)
          if not m: raise SystemExit('payload array not found')
          vals=[]
          for line in m.group(1).splitlines():
              line=line.strip().rstrip(',')
              if line: vals.append(ast.literal_eval(line))
          data=''.join(vals)
          chunks=[data[i:i+500] for i in range(0,len(data),500)]
          out=("window.__FIBARO_ASSETS=window.__FIBARO_ASSETS||{};\n"
               "window.__FIBARO_ASSETS.alicia=window.__FIBARO_ASSETS.alicia||[];\n"
               "window.__FIBARO_ASSETS.alicia[0]=[\n  "+",\n  ".join(json.dumps(x) for x in chunks)+"\n].join('');\n")
          p.write_text(out)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/alicia-data-1.js
          git commit -m "chore: rechunk Alicia asset" || exit 0
          git push
