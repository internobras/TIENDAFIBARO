name: Public Funnel E2E

on:
  push:
    branches: [chatgpt/public-site-v2-final]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit synthetic public lead
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST 'https://kgcuqxzpxykqszdeonte.supabase.co/functions/v1/submit-intake' \
            -F 'nombre=E2E FIBARO WEB' \
            -F 'telefono=699999901' \
            -F 'email=e2e-public@fibaroteleco.test' \
            -F 'servicio=fiber' \
            -F 'intent=web_funnel' \
            -F 'consent=yes' \
            -F 'postal_code=11540' \
            -F 'technical_zone=yes' \
            -F 'funnel_detail=fibra_movil' \
            -F 'funnel_objective=pagar_menos' \
            -F 'spend_band=50_70' \
            -F 'contact_preference=whatsapp' \
            -F 'utm_source=e2e' \
            -F 'utm_medium=github' \
            -F 'utm_campaign=public_v2_final' \
            -F 'landing_path=/')
          echo "$response"
          echo "$response" | jq -e '.ok == true and (.reference | length > 0)'
