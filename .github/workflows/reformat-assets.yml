name: Reformat deploy assets

on:
  push:
    branches: [chatgpt/deploy-friendly-assets]

permissions:
  contents: write

jobs:
  reformat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reformat large text assets without changing behaviour
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('assets/alicia-data-1.js')
          s = p.read_text()
          m = re.search(r"window\.__FIBARO_ASSETS\.alicia\[0\]='([^']*)';", s, re.S)
          if not m:
              raise SystemExit('Alicia asset payload not found')
          data = m.group(1)
          chunks = [data[i:i+3000] for i in range(0, len(data), 3000)]
          out = (
              "window.__FIBARO_ASSETS=window.__FIBARO_ASSETS||{};\n"
              "window.__FIBARO_ASSETS.alicia=window.__FIBARO_ASSETS.alicia||[];\n"
              "window.__FIBARO_ASSETS.alicia[0]=[\n  "
              + ",\n  ".join(json.dumps(x) for x in chunks)
              + "\n].join('');\n"
          )
          p.write_text(out)

          css = Path('assets/styles.css')
          c = css.read_text()
          c = c.replace('}', '}\n')
          css.write_text(c)
          PY
      - name: Commit transformed assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/alicia-data-1.js assets/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: split large static assets for reproducible deploys"
          git push
